spring.application.name=app-server

# =========================
# SERVER CONFIG
# =========================
server.port=${PORT:8080}

# =========================
# DATABASE CONFIG (PRODUCTION READY)
# =========================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dev}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:sohag666}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA / HIBERNATE
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false

# =========================
# JWT CONFIG
# =========================
jwt.secret=${JWT_SECRET:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNA==}

# Expiration Settings (ms)
jwt.access.expiration=1800000
jwt.refresh.expiration=604800000

# =========================
# FILE UPLOAD CONFIG
# =========================
image.destinationDir=uploads

# =========================
# DEFAULT CREDENTIALS (OPTIONAL)
# =========================
app.default.faculty.password=Faculty@123
app.default.student.password=Student@123